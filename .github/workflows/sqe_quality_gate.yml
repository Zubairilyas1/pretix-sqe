name: SQE CI Quality Gate

on:
  push:
    branches: [ main, zubair, member/zubair, member/sami, member/tawassul ]
  pull_request:
    branches: [ main, zubair ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whitebox_unit_tests:
    name: White-Box Unit Tests & Branch Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Execute Pytest Suite with Coverage Enforcement
        run: |
          source .venv/bin/activate
          pytest src/tests/team/zubair/ --cov=pretix.base.services.quotas --cov-report=term-missing --cov-report=xml

  mutation_quality_gate:
    name: Mutation Testing Quality Gate (Custom Operators)
    runs-on: ubuntu-latest
    needs: [whitebox_unit_tests]
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Enforce Mutation Quality Gate (Threshold >= 80%)
        run: |
          source .venv/bin/activate
          python src/tests/team/zubair/mutation/mutation_runner.py
